<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambassador Activity Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --page: #fff7cc;
        --panel: #ffffff;
        --ink: #020202;
        --muted: #5c5540;
        --helper: #8a7f5b;
        --line: #ece2ad;
        --line-strong: #d9ca60;
        --soft: #fff9dc;
        --brand-yellow: #ffe001;
        --brand-yellow-hover: #f1c900;
        --brand-black: #020202;
        --brand-purple: #7861a9;
        --brand-orange: #f57323;
        --brand-red: #ed3732;
        --brand-olive: #807001;
        --danger: var(--brand-red);
        --shadow: 0 18px 42px rgba(2, 2, 2, 0.1);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(255, 224, 1, 0.48) 0%, rgba(255, 255, 255, 0.94) 42%, rgba(245, 115, 35, 0.12) 100%),
          var(--page);
        color: var(--ink);
        font-family: Barlow, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        font-weight: 400;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      .page-shell {
        width: min(900px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 18px;
        align-items: start;
      }

      .form-panel,
      .coins-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .form-panel {
        padding: 32px;
      }

      .page-header {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        margin-bottom: 28px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--brand-black);
        color: var(--brand-yellow);
        font-size: 22px;
        font-weight: 700;
      }

      .breadcrumb,
      .field-label {
        margin: 0;
        color: var(--brand-olive);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        margin-top: 4px;
        color: var(--ink);
        font-size: 22px;
        font-weight: 700;
        line-height: 1.18;
      }

      .deadline-note {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field-grid + .field-grid {
        margin-top: 16px;
      }

      .field-grid.single {
        grid-template-columns: minmax(0, 1fr);
      }

      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      input,
      select,
      textarea,
      .prefix-field {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        font-size: 14px;
        font-weight: 400;
        outline: none;
      }

      input,
      select,
      textarea {
        padding: 12px 13px;
      }

      select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--brand-black) 50%),
          linear-gradient(135deg, var(--brand-black) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 50%,
          calc(100% - 13px) 50%;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        padding-right: 34px;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus,
      .prefix-field:focus-within,
      .drop-zone:focus-visible {
        border-color: var(--brand-black);
        box-shadow: 0 0 0 3px rgba(255, 224, 1, 0.38);
      }

      input:disabled {
        cursor: not-allowed;
        background: #fff5c4;
        color: var(--helper);
      }

      .prefix-field {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        overflow: hidden;
      }

      .prefix-symbol {
        align-self: stretch;
        display: grid;
        place-items: center;
        padding: 0 11px 0 13px;
        color: var(--brand-black);
        background: var(--brand-yellow);
        border-right: 1px solid var(--line);
        font-weight: 600;
      }

      .prefix-field input {
        border: 0;
        border-radius: 0;
        padding-left: 11px;
        box-shadow: none;
      }

      .helper {
        color: var(--helper);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.35;
      }

      .section-separator {
        margin: 24px 0 0;
        border-top: 1px solid var(--line);
      }

      .section-heading {
        margin: 24px 0 14px;
      }

      .section-heading h2 {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.3;
      }

      .activities {
        display: grid;
        gap: 14px;
      }

      .activity-card {
        display: grid;
        gap: 16px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .activity-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .activity-index {
        color: var(--brand-purple);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
      }

      .icon-button {
        width: 34px;
        height: 34px;
        display: inline-grid;
        place-items: center;
        border-radius: 8px;
        background: transparent;
        color: var(--helper);
        cursor: pointer;
        transition: color 140ms ease, background 140ms ease;
      }

      .icon-button:hover {
        color: var(--danger);
        background: #fff1ef;
      }

      .icon-button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .icon-button:disabled:hover {
        color: var(--helper);
        background: transparent;
      }

      .activity-grid {
        display: grid;
        grid-template-columns: minmax(126px, 0.42fr) minmax(0, 0.58fr);
        gap: 14px;
      }

      .drop-zone {
        position: relative;
        min-height: 96px;
        display: grid;
        place-items: center;
        gap: 5px;
        padding: 15px 14px;
        border: 1.5px dashed var(--line-strong);
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
        text-align: center;
        cursor: pointer;
        outline: none;
        transition: border-color 140ms ease, background 140ms ease;
      }

      .drop-zone:hover,
      .drop-zone.is-dragging,
      .drop-zone.has-files {
        border-color: var(--brand-black);
        background: #fff4a8;
      }

      .drop-zone.is-invalid {
        border-color: var(--danger);
        background: #fff1ef;
      }

      .drop-zone i {
        color: var(--brand-purple);
        font-size: 22px;
      }

      .drop-zone-title {
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
      }

      .proof-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .file-list {
        display: grid;
        gap: 6px;
      }

      .file-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 26px;
        gap: 8px;
        align-items: center;
        padding: 7px 8px 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .file-name {
        overflow: hidden;
        color: #3e3928;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-remove {
        width: 26px;
        height: 26px;
        display: inline-grid;
        place-items: center;
        border-radius: 7px;
        background: transparent;
        color: var(--helper);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .file-remove:hover {
        color: var(--danger);
        background: #fff1ef;
      }

      .comment-toggle {
        width: fit-content;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        background: transparent;
        color: var(--brand-black);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      .comment-toggle:hover {
        color: var(--brand-purple);
      }

      .comment-field {
        margin-top: 10px;
      }

      .activity-total-row {
        display: flex;
        justify-content: flex-end;
        padding-top: 2px;
      }

      .coin-counter {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--brand-black);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.2;
      }

      .coin-counter i {
        color: var(--brand-olive);
        font-size: 17px;
      }

      .actions {
        display: grid;
        gap: 14px;
        margin-top: 22px;
      }

      .add-button,
      .primary-button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .add-button {
        justify-self: center;
        width: auto;
        padding: 0 15px;
        border: 1px solid rgba(2, 2, 2, 0.72);
        background: #ffffff;
        color: var(--brand-black);
      }

      .add-button:hover {
        background: var(--brand-yellow);
      }

      .primary-button {
        width: 100%;
        min-height: 52px;
        padding: 0 22px;
        background: var(--brand-yellow);
        color: var(--brand-black);
        font-size: 15px;
        box-shadow: 0 12px 22px rgba(255, 224, 1, 0.42);
      }

      .primary-button:hover:not(:disabled) {
        background: var(--brand-yellow-hover);
      }

      .primary-button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        box-shadow: none;
      }

      .coins-card {
        position: sticky;
        top: 20px;
        overflow: hidden;
      }

      .coins-hero {
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(255, 224, 1, 0.16) 0%, rgba(245, 115, 35, 0.18) 52%, rgba(120, 97, 169, 0.3) 100%),
          var(--brand-black);
        color: #ffffff;
      }

      .coins-label {
        display: block;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .coins-number {
        display: block;
        margin-top: 10px;
        font-size: 58px;
        font-weight: 700;
        line-height: 0.95;
      }

      .coins-context {
        display: block;
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        font-weight: 400;
      }

      .progress-track {
        height: 5px;
        margin-top: 15px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      .progress-fill {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--brand-yellow);
        transition: width 160ms ease;
      }

      .summary-lines {
        display: grid;
        padding: 0 20px 12px;
      }

      .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .summary-row:first-child {
        border-top: 0;
      }

      .summary-row span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }

      .summary-row strong {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
        text-align: right;
      }

      .result {
        margin: 14px 20px 18px;
        min-height: 70px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--brand-black);
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .result:empty::before {
        content: " ";
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 820px) {
        .page-shell {
          grid-template-columns: 1fr;
        }

        .coins-card {
          position: static;
          order: -1;
        }

        .coins-hero {
          padding: 20px 22px;
        }

        .coins-number {
          font-size: 48px;
        }
      }

      @media (max-width: 640px) {
        .page-shell {
          width: min(100vw - 20px, 900px);
          padding: 10px 0 18px;
        }

        .form-panel {
          padding: 24px 20px;
        }

        .page-header {
          grid-template-columns: 40px minmax(0, 1fr);
          gap: 12px;
        }

        .brand-mark {
          width: 40px;
          height: 40px;
          font-size: 20px;
        }

        .field-grid,
        .activity-grid {
          grid-template-columns: 1fr;
        }

        .activity-card {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="form-panel" aria-label="Ambassador activity report">
        <header class="page-header">
          <div class="brand-mark" aria-hidden="true">U</div>
          <div>
            <p class="breadcrumb">Student Ambassador Program</p>
            <h1>Ambassador activity report</h1>
            <p class="deadline-note">Заповни до 5-го числа наступного місяця</p>
          </div>
        </header>

        <form id="activity-form" novalidate>
          <div class="field-grid single">
            <label class="field">
              <span class="field-label">Ім'я у Slack</span>
              <input
                name="slackNickname"
                autocomplete="name"
                placeholder="Diana Bondarenko"
                aria-describedby="slack-name-hint"
                required
                minlength="2"
              />
              <span class="helper" id="slack-name-hint">Напишіть так, як ви підписані у Slack.</span>
            </label>
          </div>

          <div class="field-grid single">
            <label class="field">
              <span class="field-label">Місяць</span>
              <select name="month" id="month" required></select>
            </label>
          </div>

          <div class="section-separator" aria-hidden="true"></div>
          <div class="section-heading">
            <h2>Активності</h2>
          </div>

          <div id="activities" class="activities"></div>

          <div class="actions">
            <button class="add-button" type="button" id="add-activity">
              <i class="ti ti-plus" aria-hidden="true"></i>
              <span>Додати активність</span>
            </button>
            <button class="primary-button" type="submit" id="submit-button" disabled>
              <i class="ti ti-send" aria-hidden="true"></i>
              <span>Відправити форму</span>
            </button>
          </div>
        </form>
      </section>

      <aside class="coins-card" aria-label="Coins summary">
        <div class="coins-hero">
          <span class="coins-label">Coins</span>
          <strong class="coins-number" id="subtotal">0</strong>
          <span class="coins-context">з 500 можливих</span>
          <div class="progress-track" aria-hidden="true">
            <span class="progress-fill" id="progress-fill"></span>
          </div>
        </div>
        <div class="summary-lines">
          <div class="summary-row">
            <span>Активностей</span>
            <strong id="activity-count">0 шт.</strong>
          </div>
          <div class="summary-row">
            <span>Бонус</span>
            <strong id="bonus">0 coins</strong>
          </div>
          <div class="summary-row">
            <span>Total у формі</span>
            <strong id="total">0 coins</strong>
          </div>
        </div>
        <pre id="result" class="result" role="status" aria-live="polite"></pre>
      </aside>
    </main>

    <template id="activity-template">
      <section class="activity-card">
        <div class="activity-card-header">
          <span class="activity-index">Активність 1</span>
          <button class="icon-button remove-activity" type="button" title="Видалити активність" aria-label="Видалити активність">
            <i class="ti ti-trash" aria-hidden="true"></i>
          </button>
        </div>

        <label class="field">
          <span class="field-label">Тип активності</span>
          <select class="activity-select" required></select>
        </label>

        <div class="activity-grid">
          <label class="field quantity-field">
            <span class="field-label">Кількість</span>
            <input class="quantity-input" type="text" inputmode="numeric" pattern="[1-9][0-9]*" value="1" required disabled />
            <span class="helper quantity-hint">Обери тип активності</span>
          </label>

          <div class="field proof-field">
            <span class="field-label">Підтвердження</span>
            <label class="drop-zone" tabindex="0">
              <input class="proof-input" type="file" multiple accept="image/*,.pdf" />
              <i class="ti ti-upload" aria-hidden="true"></i>
              <span class="drop-zone-title">Прикріпи скріншот або посилання</span>
              <span class="helper">PNG, JPG або PDF</span>
            </label>
            <div class="file-list" hidden></div>
          </div>
        </div>

        <div class="comment-block">
          <button class="comment-toggle" type="button">
            <i class="ti ti-plus" aria-hidden="true"></i>
            <span>Додати коментар</span>
          </button>
          <label class="field comment-field" hidden>
            <span class="field-label">Коментар</span>
            <textarea class="notes-input" rows="3"></textarea>
          </label>
        </div>

        <div class="activity-total-row">
          <span class="coin-counter">
            <i class="ti ti-coin" aria-hidden="true"></i>
            <span class="activity-total">= 0 coins</span>
          </span>
        </div>
      </section>
    </template>

    <script>
      const MAX_COINS = 500;
      const MONTH_NAMES = [
        "Січень",
        "Лютий",
        "Березень",
        "Квітень",
        "Травень",
        "Червень",
        "Липень",
        "Серпень",
        "Вересень",
        "Жовтень",
        "Листопад",
        "Грудень"
      ];

      const state = {
        activities: [],
        bonusThreshold: 3,
        bonusCoins: 10,
        currentMonth: "",
        submitting: false,
        validationAttempted: false
      };

      const form = document.querySelector("#activity-form");
      const activityContainer = document.querySelector("#activities");
      const template = document.querySelector("#activity-template");
      const monthSelect = document.querySelector("#month");
      const addButton = document.querySelector("#add-activity");
      const submitButton = document.querySelector("#submit-button");
      const subtotalEl = document.querySelector("#subtotal");
      const activityCountEl = document.querySelector("#activity-count");
      const bonusEl = document.querySelector("#bonus");
      const totalEl = document.querySelector("#total");
      const progressFillEl = document.querySelector("#progress-fill");
      const resultEl = document.querySelector("#result");

      init().catch((error) => {
        showResult(error.message || "Could not load form configuration.", true);
        updateSubmitState();
      });

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const response = await fetch("/api/form-config");
        if (!response.ok) {
          throw new Error("Could not load form configuration.");
        }

        const config = await response.json();
        state.activities = Array.isArray(config.activities) ? config.activities : [];
        state.bonusThreshold = Number(config.bonusThreshold || state.bonusThreshold);
        state.bonusCoins = Number(config.bonusCoins || state.bonusCoins);
        state.currentMonth = config.currentMonth || "";

        populateMonths(config.months || [], params.get("month") || state.currentMonth);
        addActivityRow();

        addButton.addEventListener("click", addActivityRow);
        form.addEventListener("submit", submitForm);
        form.addEventListener("input", () => {
          sanitizeSlackInput();
          updateSubmitState();
        });
        form.addEventListener("change", updateSubmitState);
        updateSummary();
      }

      function populateMonths(months, selectedMonth) {
        monthSelect.replaceChildren();
        for (const month of months) {
          const option = document.createElement("option");
          option.value = month;
          option.textContent = formatMonth(month);
          monthSelect.append(option);
        }
        if (selectedMonth && months.includes(selectedMonth)) {
          monthSelect.value = selectedMonth;
        }
      }

      function formatMonth(value) {
        const match = /^(\d{4})-(\d{2})$/.exec(value);
        if (!match) return value;
        const monthIndex = Number(match[2]) - 1;
        return `${MONTH_NAMES[monthIndex] || match[2]} ${match[1]}`;
      }

      function addActivityRow() {
        const row = template.content.firstElementChild.cloneNode(true);
        const select = row.querySelector(".activity-select");
        const quantityInput = row.querySelector(".quantity-input");
        const proofInput = row.querySelector(".proof-input");
        const dropZone = row.querySelector(".drop-zone");
        const commentToggle = row.querySelector(".comment-toggle");
        const commentField = row.querySelector(".comment-field");

        buildActivityOptions(select);

        row.querySelector(".remove-activity").addEventListener("click", () => {
          if (activityContainer.children.length <= 1) return;
          row.remove();
          renumberActivities();
          updateSummary();
        });

        select.addEventListener("change", () => {
          updateActivityRow(row);
          updateSummary();
        });

        quantityInput.addEventListener("input", (event) => {
          sanitizeQuantityInput(event.currentTarget);
          updateSummary();
        });

        proofInput.addEventListener("change", () => {
          renderFileList(row);
          updateSummary();
        });

        dropZone.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            proofInput.click();
          }
        });
        dropZone.addEventListener("dragover", (event) => {
          event.preventDefault();
          dropZone.classList.add("is-dragging");
        });
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("is-dragging"));
        dropZone.addEventListener("drop", (event) => {
          event.preventDefault();
          dropZone.classList.remove("is-dragging");
          const files = Array.from(event.dataTransfer?.files || []);
          if (!files.length) return;
          setInputFiles(proofInput, [...Array.from(proofInput.files), ...files]);
        });

        commentToggle.addEventListener("click", () => {
          commentToggle.hidden = true;
          commentField.hidden = false;
          commentField.querySelector("textarea").focus();
        });

        row.querySelectorAll("input, select, textarea").forEach((input) => {
          input.addEventListener("input", updateSubmitState);
          input.addEventListener("change", updateSubmitState);
        });

        activityContainer.append(row);
        renumberActivities();
        updateActivityRow(row);
        updateSummary();
      }

      function buildActivityOptions(select) {
        select.replaceChildren();
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.disabled = true;
        placeholder.selected = true;
        placeholder.textContent = "Обери активність";
        select.append(placeholder);

        for (const activity of state.activities) {
          const option = document.createElement("option");
          option.value = activity.key;
          option.textContent = activity.title;
          select.append(option);
        }
      }

      function updateActivityRow(row) {
        const { activity } = rowToActivity(row);
        const quantityInput = row.querySelector(".quantity-input");
        const quantityHint = row.querySelector(".quantity-hint");
        const proofField = row.querySelector(".proof-field");
        const dropZone = row.querySelector(".drop-zone");

        quantityInput.disabled = !activity || !activity.requiresQuantity;
        quantityInput.required = Boolean(activity?.requiresQuantity);

        if (!activity || !activity.requiresQuantity) {
          quantityInput.value = "1";
        }

        if (activity) {
          quantityHint.textContent = `1 активність = ${activity.coinsPerUnit} coins`;
          proofField.hidden = !activity.requiresProof;
        } else {
          quantityHint.textContent = "Обери тип активності";
          proofField.hidden = false;
        }

        const needsProof = Boolean(activity?.requiresProof) && !row.querySelector(".proof-input").files.length;
        dropZone.classList.toggle("is-invalid", state.validationAttempted && needsProof);
      }

      function sanitizeQuantityInput(input) {
        const sanitizedValue = input.value.replace(/\D/g, "").replace(/^0+/, "");
        if (input.value !== sanitizedValue) {
          input.value = sanitizedValue;
        }
      }

      function sanitizeSlackInput() {
        const input = form.elements.slackNickname;
        const sanitizedValue = input.value.replace(/^@+/, "");
        if (input.value !== sanitizedValue) {
          input.value = sanitizedValue;
        }
      }

      function normalizeSlackName(value) {
        return value.trim().replace(/^@+/, "").trim().replace(/\s+/g, " ");
      }

      function rowToActivity(row) {
        const activityKey = row.querySelector(".activity-select").value;
        const activity = state.activities.find((item) => item.key === activityKey);
        const quantityInput = row.querySelector(".quantity-input");
        if (!activity) return { activity: undefined, quantity: 0 };
        if (!activity.requiresQuantity) return { activity, quantity: 1 };

        const parsedQuantity = Number(quantityInput.value);
        const quantity = quantityInput.value !== "" && parsedQuantity > 0 ? parsedQuantity : 0;
        return { activity, quantity };
      }

      function updateSummary() {
        let subtotal = 0;
        const distinctActivities = new Set();

        activityContainer.querySelectorAll(".activity-card").forEach((row) => {
          updateActivityRow(row);
          const { activity, quantity } = rowToActivity(row);
          const rowTotal = activity ? quantity * activity.coinsPerUnit : 0;
          subtotal += rowTotal;
          if (activity && quantity > 0) {
            distinctActivities.add(activity.key);
          }
          row.querySelector(".activity-total").textContent = `= ${rowTotal} coins`;
        });

        const bonus = distinctActivities.size >= state.bonusThreshold ? state.bonusCoins : 0;
        const total = subtotal + bonus;
        subtotalEl.textContent = String(total);
        activityCountEl.textContent = `${distinctActivities.size} шт.`;
        bonusEl.textContent = `${bonus} coins`;
        totalEl.textContent = `${total} coins`;
        progressFillEl.style.width = `${Math.min(100, (total / MAX_COINS) * 100)}%`;
        updateSubmitState();
      }

      function updateSubmitState() {
        submitButton.disabled = state.submitting || !isFormComplete();
      }

      function isFormComplete() {
        const slackNickname = normalizeSlackName(form.elements.slackNickname.value);
        const month = form.elements.month.value;
        const rows = Array.from(activityContainer.querySelectorAll(".activity-card"));

        return (
          slackNickname.length >= 2 &&
          Boolean(month) &&
          rows.length > 0 &&
          rows.every(isActivityComplete)
        );
      }

      function isActivityComplete(row) {
        const { activity, quantity } = rowToActivity(row);
        if (!activity) return false;
        if (activity.requiresQuantity && quantity < 1) return false;
        if (activity.requiresProof && row.querySelector(".proof-input").files.length === 0) return false;
        return true;
      }

      function renumberActivities() {
        activityContainer.querySelectorAll(".activity-card").forEach((row, index) => {
          row.querySelector(".activity-index").textContent = `Активність ${index + 1}`;
          row.querySelector(".remove-activity").disabled = activityContainer.children.length <= 1;
        });
      }

      function renderFileList(row) {
        const input = row.querySelector(".proof-input");
        const dropZone = row.querySelector(".drop-zone");
        const fileList = row.querySelector(".file-list");
        const files = Array.from(input.files);

        fileList.replaceChildren();
        fileList.hidden = files.length === 0;
        dropZone.classList.toggle("has-files", files.length > 0);

        files.forEach((file, index) => {
          const item = document.createElement("div");
          item.className = "file-item";

          const fileName = document.createElement("span");
          fileName.className = "file-name";
          fileName.textContent = file.name;

          const removeButton = document.createElement("button");
          removeButton.className = "file-remove";
          removeButton.type = "button";
          removeButton.setAttribute("aria-label", `Видалити ${file.name}`);
          removeButton.textContent = "×";
          removeButton.addEventListener("click", () => {
            setInputFiles(input, files.filter((_, fileIndex) => fileIndex !== index));
          });

          item.append(fileName, removeButton);
          fileList.append(item);
        });

        updateActivityRow(row);
        updateSubmitState();
      }

      function setInputFiles(input, files) {
        const dataTransfer = new DataTransfer();
        files.forEach((file) => dataTransfer.items.add(file));
        input.files = dataTransfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      }

      async function submitForm(event) {
        event.preventDefault();
        state.validationAttempted = true;
        updateSummary();
        clearResult();

        if (!isFormComplete()) {
          form.reportValidity();
          showResult("Заповни обов'язкові поля та додай підтвердження для кожної активності.", true);
          return;
        }

        state.submitting = true;
        updateSubmitState();

        try {
          const formData = new FormData();
          const slackName = normalizeSlackName(form.elements.slackNickname.value);
          formData.set("ambassadorName", slackName);
          formData.set("slackNickname", slackName);
          formData.set("slackUserId", "");
          formData.set("month", form.elements.month.value);

          const activities = [];
          activityContainer.querySelectorAll(".activity-card").forEach((row, index) => {
            const { activity, quantity } = rowToActivity(row);
            if (!activity) return;
            activities.push({
              activityKey: activity.key,
              quantity,
              notes: row.querySelector(".notes-input").value.trim()
            });

            for (const file of row.querySelector(".proof-input").files) {
              formData.append(`proof_${index}`, file);
            }
          });
          formData.set("activities", JSON.stringify(activities));

          const response = await fetch("/api/submissions", {
            method: "POST",
            body: formData
          });
          const payload = await response.json();
          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || "Submission failed.");
          }

          showResult(
            [
              "Форму відправлено.",
              "",
              payload.summary.reportLine,
              `Base coins: ${payload.summary.baseCoins}`,
              `Bonus coins: ${payload.summary.bonusCoins}`,
              `Total coins: ${payload.summary.totalCoins}`
            ].join("\n")
          );
          resetForm();
        } catch (error) {
          showResult(error.message || "Submission failed.", true);
        } finally {
          state.submitting = false;
          updateSubmitState();
        }
      }

      function resetForm() {
        form.reset();
        state.validationAttempted = false;
        if (state.currentMonth) {
          monthSelect.value = state.currentMonth;
        }
        activityContainer.replaceChildren();
        addActivityRow();
        updateSummary();
      }

      function showResult(message, isError = false) {
        resultEl.textContent = message;
        resultEl.style.color = isError ? "#ed3732" : "#020202";
      }

      function clearResult() {
        resultEl.textContent = "";
        resultEl.style.color = "#020202";
      }
    </script>
  </body>
</html>
