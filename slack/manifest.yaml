_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: Ambassador Coins
  description: Student ambassador activity reports and coin summaries.
  background_color: "#165A4A"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Ambassador Coins
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
settings:
  event_subscriptions:
    request_url: https://ambassador-ap-production.up.railway.app/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://ambassador-ap-production.up.railway.app/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
